services:
  api:
    command: sh -c "./node_modules/.bin/prisma migrate deploy && npm run start:dev"
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules

  web:
    build:
      target: dev
    environment:
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules

volumes:
  api_node_modules:
  web_node_modules:
