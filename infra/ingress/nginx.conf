map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

limit_req_zone $client_ip zone=login_limit:10m rate=5r/m;
limit_req_zone $client_ip zone=register_limit:10m rate=5r/m;
limit_req_zone $client_ip zone=verification_limit:10m rate=5r/m;
limit_req_zone $client_ip zone=password_limit:10m rate=5r/m;
limit_req_zone $client_ip zone=admin_limit:10m rate=5r/m;
limit_req_zone $client_ip zone=api_limit:10m rate=20r/s;
limit_req_zone $client_ip zone=mcp_limit:10m rate=10r/s;
limit_req_zone $client_ip zone=oauth_token_limit:10m rate=30r/m;
limit_req_zone $client_ip zone=oauth_register_limit:10m rate=5r/m;
limit_conn_zone $client_ip zone=conn_limit:10m;

limit_req_status 429;
limit_conn_status 429;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;
  client_max_body_size 10m;

  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /api {
    return 308 /api/;
  }

  location = /api/auth/login {
    limit_req zone=login_limit burst=5 nodelay;
    limit_conn conn_limit 5;
    proxy_pass http://api:3000/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location = /api/auth/register {
    limit_req zone=register_limit burst=5 nodelay;
    limit_conn conn_limit 5;
    proxy_pass http://api:3000/auth/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location /api/auth/verification/ {
    limit_req zone=verification_limit burst=5 nodelay;
    limit_conn conn_limit 5;
    proxy_pass http://api:3000/auth/verification/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location = /api/auth/password/forgot {
    limit_req zone=password_limit burst=5 nodelay;
    limit_conn conn_limit 5;
    proxy_pass http://api:3000/auth/password/forgot;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location = /api/auth/password/reset {
    limit_req zone=password_limit burst=5 nodelay;
    limit_conn conn_limit 5;
    proxy_pass http://api:3000/auth/password/reset;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location /api/admin/ {
    limit_req zone=admin_limit burst=5 nodelay;
    limit_conn conn_limit 5;
    proxy_pass http://api:3000/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # --- OAuth 2.1 (atrás de OAUTH_ENABLED nos serviços; sem a flag respondem 404) ---
  # As URLs .well-known precisam estar na raiz do host (o issuer não tem caminho).
  location = /.well-known/oauth-authorization-server {
    limit_req zone=api_limit burst=40 nodelay;
    limit_conn conn_limit 20;
    # CORS aberto e sem credenciais: clientes de navegador (ex.: MCP Inspector)
    # chamam estes endpoints de outra origem. `add_header` aqui desliga a
    # herança dos cabeçalhos do server (e `proxy_hide_header` também), então
    # os dois grupos são repetidos.
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, MCP-Protocol-Version" always;
      add_header Access-Control-Max-Age 86400 always;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://api:3000/.well-known/oauth-authorization-server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # Sem URI no proxy_pass o caminho é repassado como veio (com ou sem /mcp).
  location ^~ /.well-known/oauth-protected-resource {
    limit_req zone=api_limit burst=40 nodelay;
    limit_conn conn_limit 20;
    # CORS aberto e sem credenciais: clientes de navegador (ex.: MCP Inspector)
    # chamam estes endpoints de outra origem. `add_header` aqui desliga a
    # herança dos cabeçalhos do server (e `proxy_hide_header` também), então
    # os dois grupos são repetidos.
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, MCP-Protocol-Version" always;
      add_header Access-Control-Max-Age 86400 always;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://mcp:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location = /api/oauth/token {
    limit_req zone=oauth_token_limit burst=10 nodelay;
    limit_conn conn_limit 10;
    # CORS aberto e sem credenciais: clientes de navegador (ex.: MCP Inspector)
    # chamam estes endpoints de outra origem. `add_header` aqui desliga a
    # herança dos cabeçalhos do server (e `proxy_hide_header` também), então
    # os dois grupos são repetidos.
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, MCP-Protocol-Version" always;
      add_header Access-Control-Max-Age 86400 always;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://api:3000/oauth/token;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location = /api/oauth/register {
    limit_req zone=oauth_register_limit burst=5 nodelay;
    limit_conn conn_limit 5;
    # CORS aberto e sem credenciais: clientes de navegador (ex.: MCP Inspector)
    # chamam estes endpoints de outra origem. `add_header` aqui desliga a
    # herança dos cabeçalhos do server (e `proxy_hide_header` também), então
    # os dois grupos são repetidos.
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, MCP-Protocol-Version" always;
      add_header Access-Control-Max-Age 86400 always;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://api:3000/oauth/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location = /api/oauth/revoke {
    limit_req zone=api_limit burst=40 nodelay;
    limit_conn conn_limit 10;
    # CORS aberto e sem credenciais: clientes de navegador (ex.: MCP Inspector)
    # chamam estes endpoints de outra origem. `add_header` aqui desliga a
    # herança dos cabeçalhos do server (e `proxy_hide_header` também), então
    # os dois grupos são repetidos.
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, MCP-Protocol-Version" always;
      add_header Access-Control-Max-Age 86400 always;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://api:3000/oauth/revoke;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # Servidor MCP remoto (Streamable HTTP). A autenticação é o token do usuário
  # (tfp_ ou, com OAuth, tfo_), validado pela API; aqui só limitamos taxa e conexões.
  location = /mcp {
    limit_req zone=mcp_limit burst=20 nodelay;
    limit_conn conn_limit 10;
    proxy_pass http://mcp:3100/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_buffering off;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    limit_conn conn_limit 20;
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /docs {
    limit_req zone=api_limit burst=40 nodelay;
    limit_conn conn_limit 20;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location / {
    limit_conn conn_limit 50;
    proxy_pass http://web:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}
