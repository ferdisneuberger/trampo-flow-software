map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

limit_req_zone $client_ip zone=login_limit:10m rate=5r/m;
limit_req_zone $client_ip zone=api_limit:10m rate=20r/s;
limit_conn_zone $client_ip zone=conn_limit:10m;

limit_req_status 429;
limit_conn_status 429;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;
  client_max_body_size 10m;

  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /api {
    return 308 /api/;
  }

  location = /api/auth/login {
    limit_req zone=login_limit burst=5 nodelay;
    limit_conn conn_limit 5;
    proxy_pass http://api:3000/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    limit_conn conn_limit 20;
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /docs {
    limit_req zone=api_limit burst=40 nodelay;
    limit_conn conn_limit 20;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP $client_ip;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location / {
    limit_conn conn_limit 50;
    proxy_pass http://web:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}
