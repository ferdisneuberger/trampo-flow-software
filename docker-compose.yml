name: trampo-flow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trampo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trampo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-trampo_flow}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  adminer:
    image: adminer:4
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '127.0.0.1:${ADMINER_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
    networks:
      - backend

  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-trampo}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-trampo_dev_secret}
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:9000'
    volumes:
      - minio_data:/data
    networks:
      - backend

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "./node_modules/.bin/prisma migrate deploy && node dist/main"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-trampo}:${POSTGRES_PASSWORD:-trampo_dev}@postgres:5432/${POSTGRES_DB:-trampo_flow}
      CORS_ORIGINS: '${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://app.example.com}'
      AUTH_EMAIL: '${AUTH_EMAIL:-}'
      AUTH_PASSWORD: '${AUTH_PASSWORD:-}'
      AUTH_TOKEN_SECRET: '${AUTH_TOKEN_SECRET:?defina AUTH_TOKEN_SECRET no arquivo .env}'
      APP_BASE_URL: '${APP_BASE_URL:-http://localhost:5173}'
      REGISTRATION_ENABLED: '${REGISTRATION_ENABLED:-false}'
      EMAIL_VERIFICATION_TTL_HOURS: '${EMAIL_VERIFICATION_TTL_HOURS:-24}'
      VERIFICATION_RESEND_SECONDS: '${VERIFICATION_RESEND_SECONDS:-120}'
      PASSWORD_RESET_TTL_MINUTES: '${PASSWORD_RESET_TTL_MINUTES:-60}'
      TERMS_VERSION: '${TERMS_VERSION:-2026-11}'
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID:-}'
      SMTP_HOST: '${SMTP_HOST:-smtp.gmail.com}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_SECURE: '${SMTP_SECURE:-false}'
      SMTP_USER: '${SMTP_USER:-}'
      SMTP_PASS: '${SMTP_PASS:-}'
      MAIL_FROM: '${MAIL_FROM:-}'
      MAIL_FROM_NAME: '${MAIL_FROM_NAME:-Trampo Flow}'
      JWT_SECRET: '${JWT_SECRET:?defina JWT_SECRET no arquivo .env}'
      JWT_EXPIRES_IN: '${JWT_EXPIRES_IN:-5m}'
      REFRESH_TOKEN_TTL_DAYS: '${REFRESH_TOKEN_TTL_DAYS:-7}'
      REFRESH_TOKEN_GRACE_SECONDS: '${REFRESH_TOKEN_GRACE_SECONDS:-10}'
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: 'false'
      S3_ACCESS_KEY: '${S3_ACCESS_KEY:-trampo}'
      S3_SECRET_KEY: '${S3_SECRET_KEY:-trampo_dev_secret}'
      S3_BUCKET: '${S3_BUCKET:-trampo-files}'
      S3_REGION: '${S3_REGION:-us-east-1}'
      LOGIN_MAX_ATTEMPTS: '${LOGIN_MAX_ATTEMPTS:-10}'
      LOGIN_WINDOW_SECONDS: '${LOGIN_WINDOW_SECONDS:-900}'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: '${VITE_GOOGLE_CLIENT_ID:-}'
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  ingress:
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:8080'
    volumes:
      - ./infra/ingress/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

volumes:
  postgres_data:
  minio_data:

networks:
  backend:
    driver: bridge
